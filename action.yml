name: Update README Screenshot
description: Capture a screenshot of a site and commit the updated image reference in the root README.
author: Mrchazaaa
branding:
  icon: image
  color: blue
inputs:
  url:
    description: URL to open and capture.
    required: true
  image_path:
    description: Repo-relative path where the captured asset should be written.
    required: true
  marker_name:
    description: Marker name used for the README block, such as screenshot or hero.
    required: false
    default: screenshot
  capture_format:
    description: Whether to capture a static PNG image or an animated GIF.
    required: false
    default: image
  readme_path:
    description: Repo-relative path to the README file to update.
    required: false
    default: README.md
  viewport_width:
    description: Browser viewport width in pixels.
    required: false
    default: "1440"
  viewport_height:
    description: Browser viewport height in pixels.
    required: false
    default: "900"
  wait_until:
    description: Playwright waitUntil value for page navigation.
    required: false
    default: networkidle
  navigation_retries:
    description: Number of times to retry page navigation after the initial attempt fails.
    required: false
    default: "0"
  navigation_retry_delay_ms:
    description: Delay between navigation retry attempts in milliseconds.
    required: false
    default: "1000"
  delay_ms:
    description: Additional delay after navigation before taking the screenshot.
    required: false
    default: "0"
  gif_duration_ms:
    description: Duration of the GIF capture in milliseconds when capture_format is gif.
    required: false
    default: "1000"
  browser_path:
    description: Optional explicit browser executable path.
    required: false
  commit_message:
    description: Commit message used when files changed.
    required: false
    default: "chore: update README screenshot"
  git_user_name:
    description: Git author name for the generated commit.
    required: false
    default: github-actions[bot]
  git_user_email:
    description: Git author email for the generated commit.
    required: false
    default: 41898282+github-actions[bot]@users.noreply.github.com
  target_branch:
    description: Optional branch to push the generated commit to instead of the currently checked out branch.
    required: false
  token:
    description: GitHub token with contents:write permission.
    required: false
    default: ${{ github.token }}
outputs:
  changed:
    description: Whether the screenshot or README content changed.
  commit_sha:
    description: SHA of the created commit, or empty when unchanged.
  image_path:
    description: Repo-relative asset path written by the action.
runs:
  using: node20
  main: dist/index.js
