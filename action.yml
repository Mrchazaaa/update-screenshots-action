name: Update README Screenshot
description: Capture a site as a PNG screenshot or animated GIF, write it to a repo-relative path, and update a marked README block.
author: Mrchazaaa
branding:
  icon: image
  color: blue
inputs:
  url:
    description: URL to open and capture.
    required: true
  image_path:
    description: Repo-relative path where the captured asset should be written.
    required: true
  marker_name:
    description: Marker name used for the README block, such as screenshot or hero.
    required: false
    default: screenshot
  capture_format:
    description: Whether to capture a static PNG image or an animated GIF.
    required: false
    default: image
  readme_path:
    description: Repo-relative path to the README file to update.
    required: false
    default: README.md
  viewport_width:
    description: Browser viewport width in pixels.
    required: false
    default: "1440"
  viewport_height:
    description: Browser viewport height in pixels.
    required: false
    default: "900"
  wait_until:
    description: Playwright waitUntil value for page navigation.
    required: false
    default: networkidle
  navigation_retries:
    description: Number of times to retry page navigation after the initial attempt fails.
    required: false
    default: "0"
  navigation_retry_delay_ms:
    description: Delay between navigation retry attempts in milliseconds.
    required: false
    default: "1000"
  delay_ms:
    description: Additional delay after navigation before taking the screenshot.
    required: false
    default: "0"
  gif_duration_ms:
    description: Duration of the GIF capture in milliseconds when capture_format is gif.
    required: false
    default: "1000"
  browser_path:
    description: Optional explicit browser executable path.
    required: false
  commit_changes:
    description: Whether to commit and push updates to the currently checked-out branch.
    required: false
    default: "false"
  commit_message:
    description: Commit message used when commit_changes is true.
    required: false
    default: "docs: update screenshots"
  commit_author_name:
    description: Commit author name used when commit_changes is true.
    required: false
    default: "github-actions[bot]"
  commit_author_email:
    description: Commit author email used when commit_changes is true.
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
outputs:
  image_path:
    description: Repo-relative asset path written by the action.
  committed:
    description: Whether the action created and pushed a commit.
runs:
  using: node20
  main: dist/index.js
